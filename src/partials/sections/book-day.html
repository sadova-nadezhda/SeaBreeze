<div class="book-form__slide book-form__slide--day swiper-slide">
  <span class="book-form__month">@@month</span>
  <button class="book-form__day @@state" type="button" data-date="@@date" data-label="@@label" data-short="@@short" data-gender="@@gender">
    <span class="book-form__day-week">@@dow</span>
    <span class="book-form__day-num">@@day</span>
  </button>
</div>
